<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Mientras la página esté en construcción le pedimos a Google que NO la indexe.
         ⚠️ Cuando el blog esté listo, BORRÁ esta línea (si no, nunca aparecerá en el buscador). -->
    <meta name="robots" content="noindex">

    <title>Blog · En construcción · Noodle/Lab</title>

    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Ruta absoluta ("/"): busca siempre desde la raíz del sitio, sin importar en qué carpeta está esta página -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <a href="/" class="status-brand" aria-label="Ir al inicio de Noodle/Lab">Noodle<span>/</span>Lab</a>

    <main class="status-page status-page--blog">

        <!-- Elemento de la tabla periódica: Bl = Blog, "en preparación" -->
        <div class="status-element" aria-hidden="true">
            <span class="status-element-number">07</span>
            <span class="status-element-symbol">Bl</span>
            <div>
                <span class="status-element-name">BLOG</span><br>
                <span class="status-element-cat">En preparación</span>
            </div>
        </div>

        <div class="status-tube" aria-hidden="true"><div class="status-liquid"></div></div>

        <span class="status-tag">[ EN CONSTRUCCIÓN ]</span>

        <h1 class="status-title">Estamos cocinando el blog.</h1>

        <p class="status-message">
            Esta sección todavía está en el laboratorio. Volvé pronto, o mientras tanto
            elegí tu caldo y seguinos en Instagram.
        </p>

        <div class="status-actions">
            <a href="/" class="btn-cta">
                <i data-lucide="arrow-left"></i>
                Volver al inicio
            </a>
            <a href="https://instagram.com/noodle.lab" class="btn-cta btn-cta--outline" target="_blank" rel="noopener noreferrer">
                Seguinos en Instagram
                <i data-lucide="arrow-up-right"></i>
            </a>
        </div>

    </main>

    <script>
        /* Dibuja los íconos de Lucide */
        lucide.createIcons();
    </script>

</body>

</html>
